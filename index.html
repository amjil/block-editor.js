<!DOCTYPE html>
<html lang="mn-Mong">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Block editor</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100dvh; font-family: sans-serif; }
        header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
        #host { flex: 1; min-height: 0; }
    </style>
</head>
<body>
    <header>Block editor — Table inserts a vertical-script grid</header>
    <div id="host"></div>
    <script type="module">
        import { createBlockEditor } from './src/index.js';
        const editor = createBlockEditor('#host', { showPrint: true });
        editor.setBlocks([
            { id: 'p1', type: 'paragraph', text: '' },
            {
                id: 't1',
                type: 'table',
                data: {
                    'col-count': 2,
                    'row-count': 2,
                    cells: { '0,0': 'ᠲᠡᠷᠢᠭᠦᠨ', '0,1': 'ᠳᠡᠳ᠋', '1,0': 'ᠥᠭᠭᠦᠭᠳᠡᠯ', '1,1': '' }
                }
            }
        ]);
    </script>
</body>
</html>
